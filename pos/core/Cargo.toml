[package]
name = "janus-pos-core"
version = "0.1.0"
edition = "2021"
description = "Deterministic core of the Janus POS semi-self POS simulator"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = { version = "0.2", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }
ts-rs = { version = "12", optional = true }

[features]
default = []
wasm = ["dep:wasm-bindgen", "dep:console_error_panic_hook"]
ts = ["dep:ts-rs"]

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
